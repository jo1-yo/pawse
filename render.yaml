# Render Blueprint — one-click deploy of the Pawse backend.
# In Render: New + → Blueprint → pick this repo. It reads this file, then asks
# you to fill OPENAI_API_KEY (it's never stored in the repo).
services:
  - type: web
    name: pawse-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard, not in Git

  # The web app itself — the Expo static export. Alternative to Vercel if you'd
  # rather keep site + backend in one dashboard. Attach the custom domain under
  # this service's Settings → Custom Domains.
  - type: web
    name: pawse-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_SITE_URL
        value: https://paws3.com
    routes:
      - type: rewrite
        source: /settings
        destination: /settings.html
      - type: rewrite
        source: /onboarding
        destination: /onboarding.html
